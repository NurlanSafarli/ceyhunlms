name: Publish Jayhun Tech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, gd
          coverage: none
      - run: npm run test:php
      - run: npm run build
      - run: node scripts/package-php.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: jayhuntech-php-hosting
          path: dist-php/
          include-hidden-files: true
      - run: npm run build:pages
        env:
          VITE_ADMIN_URL: ${{ vars.ADMIN_PANEL_URL || 'https://jayhuntech.az/admin' }}
          VITE_API_ORIGIN: ${{ vars.PHP_API_ORIGIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
